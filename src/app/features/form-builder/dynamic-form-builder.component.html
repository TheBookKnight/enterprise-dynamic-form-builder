<div class="form-container">
    <h2>{{ formTitle }}</h2>

    <!-- [level] binds parent's property to child's @Input -->
    <!-- (badgeClick) listens to child's @Output event -->
    <gov-classification-badge [level]="classificationLevel" (badgeClick)="handleBadgeClick($event)">
    </gov-classification-badge>
    <div>
        <button (click)="toggleClassification()">Change Clearance</button>
    </div>
</div>
